# Leave this to true to deploy the chart
enabled: true

# Artemis specific configuration
artemis:
  # -- Enable ActiveMQ Artemis deployment
  enabled: false
  image:
    # -- Artemis image repository
    repository: "apache/activemq-artemis"
    # -- Artemis image tag
    # Ensure this image exists and is suitable
    tag: "latest-alpine"
    # -- Artemis image pull policy
    pullPolicy: IfNotPresent
  cluster:
    # -- Enable Artemis cluster (effective if artemis.enabled is true)
    enabled: true
    # -- Number of Artemis replicas
    replicaCount: 3
    # -- Artemis cluster name
    name: "artemis-cluster"
    # -- Default username for cluster communication
    clusterUser: "artemisClusterAdmin"
    # -- Default password for cluster communication
    # User MUST change this
    clusterPassword: "CHANGE_ME_PLEASE"
  adminUser:
    # -- Artemis admin login
    login: "artemis"
    # -- Artemis admin password
    # User MUST change this
    password: "CHANGE_ME_PLEASE_TOO"
    # -- An existing kubernetes secret that contains ARTEMIS_USER and ARTEMIS_PASSWORD keys to override the default user credentials
    existingSecretName: ""
  persistence:
    # -- Enable persistence for Artemis
    enabled: true
    data:
      # -- Artemis data directory path
      # Verify this path, Artemis default data dir might differ
      path: "/var/lib/artemis-instance/data"
      # -- Mount path for Artemis data
      mountPath: "/var/lib/artemis-instance/data"
      # -- SubPath for Artemis data
      # Usually not needed with StatefulSet volumeClaimTemplates as each pod gets its own volume
      subPath: ""
    # -- Artemis persistence size
    size: "10Gi"
    # -- Artemis storage class name
    storageClassName: ""
  resources:
    # -- Artemis resource limits
    limits:
      cpu: "1Gi"
      memory: "1Gi"
    # -- Artemis resource requests
    requests:
      cpu: "500m"
      memory: "500Mi"

# ActiveMQ Classic configuration (for backwards compatibility)
replicaCount: 1
nodeSelector: {}
image:
  repository: alfresco/alfresco-activemq
  tag: 5.18.7-jre17-rockylinux8
  pullPolicy: IfNotPresent
adminUser:
  # -- An existing kubernetes secret that contains BROKER_USERNAME and BROKER_PASSWORD keys to override the default user credentials
  existingSecretName: null
  # -- Username for the default user with administrative privileges
  user: admin
  # -- Password for the default user with administrative privileges
  password: admin
podSecurityContext:
  runAsUser: 33031
  runAsGroup: 1000
  fsGroup: 1000
resources:
  requests:
    cpu: "0.25"
    memory: "512Mi"
  limits:
    cpu: "2"
    memory: "2048Mi"
service:
  name: activemq
services:
  broker:
    ports:
      internal:
        stomp: 61613
        amqp: 5672
        openwire: 61616
      external:
        stomp: 61613
        amqp: 5672
        openwire: 61616
    type: ClusterIP
  webConsole:
    ports:
      internal:
        webConsole: 8161
      external:
        webConsole: 8161
    type: NodePort
readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 6
  tcpSocket:
    port: openwire
livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 6
  tcpSocket:
    port: openwire
persistence:
  enabled: true
  baseSize: 20Gi
  storageClass: null
  # -- defines type of access required by the persistent volume
  # [Access_Modes] (https://kubernetes.io/docs/concepts/storage/persistent-volumes/#access-modes)
  accessModes:
    - ReadWriteOnce
  existingClaim: null
  data:
    mountPath: "/opt/activemq/data"
    subPath: "alfresco-infrastructure/activemq-data"
global:
  # -- Authenticate to image registry before pulling by providing an existing
  # secret of type kubernetes.io/dockerconfigjson
  alfrescoRegistryPullSecrets: quay-registry-secret
